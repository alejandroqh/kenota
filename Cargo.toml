[package]
name = "dos-kenota"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
color-eyre = "0.6.5"
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
ratatui = "0.30.2"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
simplecss = "0.2.2"
toml = "1.2.2"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
