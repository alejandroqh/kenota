<!doctype html>
<html>
<head>
  <title>How a Deck Works</title>
</head>
<body>
  <h2>How a deck works</h2>
  <ul>
    <li>A deck is one folder.</li>
    <li>Each .html file in it is one slide.</li>
    <li>Slides play in filename order: 01, 02 … 10.</li>
    <li>The &lt;title&gt; tag becomes the title in the footer bar.</li>
    <li>An optional deck.toml sets the deck title, screen size and footer.</li>
  </ul>
</body>
</html>
