<!doctype html>
<html>
<head>
  <title>Large Text</title>
  <style>
    body { background: blue; }
    h1 span { color: yellow; }
    .row { display: flex; gap: 4; justify-content: center; align-items: center; margin-bottom: 2; }
    .sample {
      border: double; background: black; padding: 0 1;
      box-shadow: 2 1; text-align: center;
    }
    .sample p { margin: 0; color: lightcyan; }
  </style>
</head>
<body>
  <h1>Large <span>text</span></h1>
  <div class="row">
    <div class="sample"><p data-font="small">Small</p><code>data-font="small"</code></div>
    <div class="sample"><p data-font="big">Big</p><code>data-font="big"</code></div>
  </div>
  <p>
    Every <code>&lt;h1&gt;</code> uses the <b>block</b> font unless CSS picks another
    with <code>--font</code>. Colors work as usual, and any FIGlet <code>.flf</code>
    file in the deck folder adds a font.
  </p>
</body>
</html>
