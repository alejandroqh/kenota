<!doctype html>
<html>
<head>
  <title>Your Talk</title>
  <meta name="transition" content="wipe-down">
  <style>
    /* A desk scene built from boxes, back to front. The wall is the field;
       the desk is rows 15-22. Columns: the computer 2-33 (centre 17.5:
       screen, stand and keyboard share it), the narration panel 38-75 with
       its shadow to 77, so the field shows 2 columns on both sides. */
    .scene div { position: absolute; }

    .desk { background: brown; --fill: "═" red; }

    /* Computer: grey case, a screen showing the title slide, a drive slot. */
    .case { background: lightgray; }
    .screen { background: blue; --fill: medium lightblue; }
    .screen-title { color: white; }
    .screen-dialog { background: lightgray; color: black; text-align: center; }
    .screen-footer { background: black; color: cyan; text-align: center; }
    .slot { background: darkgray; }
    .led { background: lightgray; color: lightgreen; }
    .stand { background: darkgray; }
    .keyboard { background: lightgray; }
    .keys { background: lightgray; --fill: "■" darkgray; }

    /* A floppy disk with the deck on it, and a mug of coffee. */
    .disk { background: black; }
    .shutter { background: darkgray; }
    .disk-label { background: white; color: blue; text-align: center; }
    /* The rim row shows the coffee inside: ▄ in brown on white. */
    .mug { background: white; color: brown; }
    .handle { background: brown; color: white; }

    /* The narration panel sits on top of the scene. */
    .story { position: absolute; top: 1; left: 38; width: 38; z-index: 1; }
  </style>
</head>
<body class="field">
  <div class="scene">
    <div class="desk" style="left: 0; top: 15; width: 80; height: 8"></div>

    <!-- the computer, its screen showing the first slide -->
    <div class="case" style="left: 2; top: 1; width: 32; height: 13"></div>
    <div class="screen" style="left: 4; top: 2; width: 28; height: 10"></div>
    <div class="screen-title" data-font="small" style="left: 6; top: 4; width: 24">KENOTA</div>
    <div class="screen-dialog" style="left: 9; top: 8; width: 18; height: 1">Press PgDn</div>
    <div class="screen-footer" style="left: 4; top: 11; width: 28; height: 1">◄ PgUp • 1/4 • PgDn ►</div>
    <div class="slot" style="left: 22; top: 12; width: 8; height: 1"></div>
    <div class="led" style="left: 31; top: 12; width: 1; height: 1">■</div>
    <div class="stand" style="left: 14; top: 14; width: 8; height: 1"></div>
    <div class="keyboard" style="left: 3; top: 16; width: 30; height: 5"></div>
    <div class="keys" style="left: 4; top: 17; width: 28; height: 3"></div>

    <!-- the deck on a floppy, and the coffee -->
    <div class="disk" style="left: 42; top: 16; width: 8; height: 4"></div>
    <div class="shutter" style="left: 44; top: 16; width: 4; height: 1"></div>
    <div class="disk-label" style="left: 43; top: 18; width: 6; height: 2">DECK</div>
    <div class="mug" style="left: 58; top: 16; width: 5; height: 4; white-space: pre"> ▄▄▄ </div>
    <div class="handle" style="left: 63; top: 17; width: 2; height: 2">▀▌<br>▄▌</div>
  </div>

  <div class="story panel">
    <p data-effect="typewriter">You have a talk to give, and a
      terminal to give it in.</p>
    <p data-step data-effect="typewriter">Write each slide as an HTML file,
      and kenota plays the folder full screen, like a 1988 DOS tutorial.</p>
  </div>
</body>
</html>
